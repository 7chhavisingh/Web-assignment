<body>
    <!-- Assignment 15: Form: Input Elements, Label and Fieldset -->
     <fieldset>
        <legend>Personal Details</legend>
        <form action="#">
            <label for="name">Name:</label>
            <input type="text" name="name" id="name">
            <br><br>
            <label for="email">Email:</label>
            <input type="email" name="email" id="email">
            <br><br>
            <label for="password">Password:</label>
            <input type="password" name="password" id="password">
            <br><br>
            <label for="Gender">Gender:</label>
            <input type="radio" name="gender" id="gender"><label for="gender">Male</label>
            <input type="radio" name="gender" id="gender"><label for="gender">Female</label>
            <br><br>
            <label for="hobb">Hobbies:</label>
            <input type="checkbox" name="hobb1" id="hobb1"><label for="hobb">Reading</label>
            <input type="checkbox" name="hobb2" id="hobb2"><label for="hobb">Coding</label>
            <br><br>
            <label for="dob">Date of Birth:</label>
            <input type="date" name="dob" id="dob">
        </form>

     </fieldset>
</body>
