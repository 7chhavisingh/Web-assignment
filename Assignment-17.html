<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment-17</title>
</head>
<body>
    <!-- Assignment 17: Form Attributes and Input validation-->
    <form action="#">
        <label for="name"></label>
        <input type="text" id="name" name="name" placeholder="Full name">
        <br><br>
        <label for="email"></label>
        <input type="email" id="email" name="email" placeholder="you@college.edu">
        <br><br>
        <label for="tel"></label>
        <input type="tel" id="tel" name="tel" placeholder="10-digit mobile">
        <br><br>
        <label for="password"></label>
        <input type="password" id="password" name="password" placeholder="Min 6 characters">
        <br><br>
        <label for="age"></label>
        <select id="age" name="age">
            <option value="">Age(<17)</option>
            <option value="18-25">(18-25)</option>
            <option value="26-35">(26-35)</option>
            <option value="36-45">(36-45)</option>
            <option value="46+">(>46)</option>
        </select>
        <br><br>
        <input type="submit" value="Register">
    </form>

</body>
</html>
