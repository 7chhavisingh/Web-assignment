<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment-18</title>
</head>
<body>
    <!--Assignment 18: Mini project: Accessible Student Admission Page-->
    <center><h1>Student Admission Form</h1>
    <h2>Courses and Fees</h2>
    <table border="1" cellpadding="10" cellspacing="0">
        <caption>Available Courses</caption>
        <tr>
            <th>Course</th>
            <th>Seats</th>
            <th>Fees</th>
        </tr>
        <tr>
            <td>B.tech CSE</td>
            <td>120</td>
            <td>&#8377;90,000</td>
        </tr>
        <tr>
            <td>BCA</td>
            <td>60</td>
            <td>&#8377;45,000</td>
        </tr>
    </table>
    <fieldset>
        <form action="#">
        <legend>Application Form</legend>
        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name"><br><br>
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email"><br><br>
        <label for="course">Course:</label><br>
        <select name="course" id="course">
            <option value="btech">B.tech CSE</option>
            <option value="bca">BCA</option>
        </select><br><br>
        <label for="statement">Statement:</label><br>
        <textarea name="statement" id="statement" ></textarea><br><br>
        <input type="submit" value="Apply">
    </form></center>
    </fieldset>

</body>
</html>
